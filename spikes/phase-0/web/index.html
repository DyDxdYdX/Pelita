<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Pelita Phase 0 operator</title>
<link rel="stylesheet" href="style.css">
<main>
  <h1>Pelita Phase 0</h1>
  <p>Use an extended display. Turn off mirroring before confirming the projector.</p>
  <label>Projector <select id="displays"></select></label>
  <button id="refresh">Refresh displays</button>
  <button id="confirm">Confirm display</button>
  <p id="status" role="status">Projection idle</p>
  <p id="error" role="alert"></p>
  <h2>Private preview</h2>
  <label>Slide <select id="preview"></select></label>
  <div id="preview-frame" class="preview"></div>
  <h2>Live output</h2>
  <p id="live">No confirmed output</p>
  <div id="actions">
    <button data-action="take">Take slide</button>
    <button data-action="previous">Previous live</button>
    <button data-action="next">Next live</button>
    <button data-action="black">Black</button>
    <button data-action="restore">Restore</button>
    <button data-action="clear">Clear</button>
    <button data-action="video" id="take-video">Take video</button>
  </div>
  <h2>Accompaniment</h2>
  <audio id="audio" controls preload="auto" aria-label="Accompaniment playback"></audio>
  <button id="restart">Restart audio</button>
  <p>Use Tab and Enter for all controls. Take video stops accompaniment.</p>
</main>
<script type="module" src="operator.js"></script>
</html>
