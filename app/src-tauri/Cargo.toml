[package]
name = "pelita"
version = "0.1.0-alpha.4"
edition = "2021"
rust-version = "1.94"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
hayro = "0.9"
image = { version = "0.25.9", default-features = false, features = ["png", "webp"] }
quick-xml = "0.42"
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
sha2 = "0.10"
tempfile = "3"
url = "2"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_WindowsProgramming", "Win32_System_Ole", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
