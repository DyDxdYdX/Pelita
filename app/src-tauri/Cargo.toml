[package]
name = "pelita"
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.94"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
